<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .table th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
        .table th a { color: inherit; text-decoration: none; }
        .table th a:hover { color: #343a40; }
        .badge-admin    { background-color: #6f42c1; }
        .badge-manager  { background-color: #0d6efd; }
        .badge-employee { background-color: #198754; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/users">
        <i class="bi bi-people-fill me-2"></i>User Management
    </a>
</nav>

<div class="container">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-0 fw-semibold">Users</h4>
            <small class="text-muted" th:text="${#lists.size(users)} + ' total'"></small>
        </div>
        <a href="/users/new" class="btn btn-primary">
            <i class="bi bi-person-plus-fill me-1"></i> Add User
        </a>
    </div>

    <!-- Search & Filter bar -->
    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">

        <!-- Search -->
        <form method="get" action="/users" class="d-flex gap-2 align-items-center">
            <input type="hidden" name="roleFilter" th:if="${roleFilter != null}" th:value="${roleFilter}">
            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="dir"  th:value="${dir}">
            <div class="input-group" style="max-width: 360px;">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" name="search" class="form-control border-start-0"
                       placeholder="Search by name or email…"
                       th:value="${search}" autocomplete="off">
                <button type="submit" class="btn btn-outline-secondary">Search</button>
            </div>
            <a th:if="${!#strings.isEmpty(search)}"
               th:href="@{/users(roleFilter=${roleFilter},sort=${sort},dir=${dir})}"
               class="btn btn-outline-danger btn-sm">
                <i class="bi bi-x-lg"></i>
            </a>
        </form>

        <!-- Role filter -->
        <div class="btn-group" role="group">
            <a th:href="@{/users(search=${search},sort=${sort},dir=${dir})}"
               th:classappend="${roleFilter == null} ? ' active'"
               class="btn btn-sm btn-outline-secondary">All</a>
            <a th:each="r : ${roles}"
               th:href="@{/users(search=${search},roleFilter=${r},sort=${sort},dir=${dir})}"
               th:classappend="${roleFilter == r} ? ' active'"
               th:text="${r.displayName}"
               class="btn btn-sm btn-outline-secondary"></a>
        </div>

    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">
                            <a th:href="@{/users(search=${search},roleFilter=${roleFilter},sort='firstName',dir=${sort == 'firstName' and dir == 'asc' ? 'desc' : 'asc'})}">
                                Name
                                <i th:if="${sort == 'firstName'}" th:class="${dir == 'asc'} ? 'bi bi-sort-up' : 'bi bi-sort-down'"></i>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/users(search=${search},roleFilter=${roleFilter},sort='email',dir=${sort == 'email' and dir == 'asc' ? 'desc' : 'asc'})}">
                                Email
                                <i th:if="${sort == 'email'}" th:class="${dir == 'asc'} ? 'bi bi-sort-up' : 'bi bi-sort-down'"></i>
                            </a>
                        </th>
                        <th>Phone</th>
                        <th>
                            <a th:href="@{/users(search=${search},roleFilter=${roleFilter},sort='role',dir=${sort == 'role' and dir == 'asc' ? 'desc' : 'asc'})}">
                                Role
                                <i th:if="${sort == 'role'}" th:class="${dir == 'asc'} ? 'bi bi-sort-up' : 'bi bi-sort-down'"></i>
                            </a>
                        </th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No users found.
                        </td>
                    </tr>
                    <tr th:each="user : ${users}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center"
                                     style="width:36px;height:36px;font-size:0.85rem;font-weight:600;"
                                     th:text="${#strings.substring(user.firstName,0,1) + #strings.substring(user.lastName,0,1)}">
                                </div>
                                <span class="fw-semibold" th:text="${user.fullName}"></span>
                            </div>
                        </td>
                        <td th:text="${user.email}" class="text-muted"></td>
                        <td th:text="${user.phone != null and !user.phone.isEmpty() ? user.phone : '—'}" class="text-muted"></td>
                        <td>
                            <span class="badge text-white"
                                  th:classappend="${user.role.name() == 'ADMIN'} ? 'badge-admin' : (${user.role.name() == 'MANAGER'} ? 'badge-manager' : 'badge-employee')"
                                  th:text="${user.role.displayName}">
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteModal"
                                    th:data-user-id="${user.id}"
                                    th:data-user-name="${user.fullName}"
                                    onclick="prepareDelete(this)">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-semibold">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-muted">
                Are you sure you want to delete <strong id="deleteUserName"></strong>? This cannot be undone.
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form id="deleteForm" method="post">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function prepareDelete(btn) {
        const userId = btn.getAttribute('data-user-id');
        const userName = btn.getAttribute('data-user-name');
        document.getElementById('deleteUserName').textContent = userName;
        document.getElementById('deleteForm').action = '/users/' + userId + '/delete';
    }
</script>
</body>
</html>
