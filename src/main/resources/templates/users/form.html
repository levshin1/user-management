<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — User Management'">User Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .form-card { max-width: 600px; margin: 0 auto; }
        .required-asterisk { color: #dc3545; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/users">
        <i class="bi bi-people-fill me-2"></i>User Management
    </a>
</nav>

<div class="container">
    <div class="form-card">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/users" class="text-decoration-none">Users</a></li>
                <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
            </ol>
        </nav>

        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold" th:text="${pageTitle}"></h5>
            </div>
            <div class="card-body p-4">

                <form th:action="${user.id == null ? '/users/new' : '/users/' + user.id + '/edit'}"
                      th:object="${user}"
                      method="post"
                      novalidate>

                    <!-- Name row -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label fw-medium">
                                First Name <span class="required-asterisk">*</span>
                            </label>
                            <input type="text"
                                   id="firstName"
                                   th:field="*{firstName}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                   placeholder="Jane"
                                   autocomplete="given-name">
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label fw-medium">
                                Last Name <span class="required-asterisk">*</span>
                            </label>
                            <input type="text"
                                   id="lastName"
                                   th:field="*{lastName}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                   placeholder="Doe"
                                   autocomplete="family-name">
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">
                            Email <span class="required-asterisk">*</span>
                        </label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="jane@example.com"
                               autocomplete="email">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <!-- Role -->
                    <div class="mb-3">
                        <label for="role" class="form-label fw-medium">
                            Role <span class="required-asterisk">*</span>
                        </label>
                        <select id="role"
                                th:field="*{role}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                            <option value="" disabled th:selected="${user.role == null}">Select a role...</option>
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r.displayName}"
                                    th:selected="${user.role == r}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{role}"></div>
                    </div>

                    <!-- Phone -->
                    <div class="mb-4">
                        <label for="phone" class="form-label fw-medium">Phone</label>
                        <input type="tel"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               placeholder="555-0100"
                               autocomplete="tel">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="${user.id == null ? 'Create User' : 'Save Changes'}"></span>
                        </button>
                        <a href="/users" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
